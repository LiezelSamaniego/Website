
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Drill</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            color: #c2185b;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, 220px);
            justify-content: center;
            gap: 20px;
        }

        .card {
            background-color: white;
            border: 2px solid #f8bbd0;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(194, 24, 91, 0.10);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(194, 24, 91, 0.18);
        }

        h3 {
            color: #ad1457;
            font-size: 16px;
            margin-bottom: 15px;
        }

        svg {
            width: 100%;
            height: 180px;
            background-color: white;
            border-radius: 10px;
        }

    </style>
</head>

<body>

    <h1>My SVG Elements</h1>

    <div class="container">

        <!-- Circle Element -->
        <div class="card">
            <h3>Circle Element</h3>

            <svg>
                <circle cx="95" cy="90" r="65"
                    fill="#f48fb1"
                    stroke="#c2185b"
                    stroke-width="6"/>
            </svg>
        </div>

        <!-- G Element -->
        <div class="card">
            <h3>G Element</h3>

            <svg>
                <g stroke="#c2185b" stroke-width="7" fill="none">
                    <rect x="10" y="40" width="180" height="110"/>
                    <line x1="100" y1="40" x2="100" y2="150"/>
                    <line x1="10" y1="95" x2="100" y2="95"/>
                </g>
            </svg>
        </div>

        <!-- Polygon Element -->
        <div class="card">
            <h3>Polygon Element</h3>

            <svg>
                <polygon points="20,10 190,15 20,165"
                    fill="#f06292"
                    stroke="#ad1457"
                    stroke-width="3"/>
            </svg>
        </div>

        <!-- Text Element -->
        <div class="card">
            <h3>Text Element</h3>

            <svg>
                <text x="25" y="55"
                    fill="#ad1457"
                    font-size="18"
                    font-weight="bold"
                    transform="rotate(25 25 55)">
                    apple
                </text>

                <text x="50" y="100"
                    fill="#ec407a"
                    font-size="18"
                    font-weight="bold"
                    transform="rotate(90 50 100)">
                    baneyney
                </text>
            </svg>
        </div>

        <!-- Line Element -->
        <div class="card">
            <h3>Line Element</h3>

            <svg>
                <line x1="15" y1="15" x2="190" y2="165"
                    stroke="#c2185b"
                    stroke-width="7"
                    stroke-linecap="round"/>
            </svg>
        </div>

    </div>

</body>
</html>
