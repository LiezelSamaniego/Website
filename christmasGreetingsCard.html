<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Greeting Card</title>

    <style>
        body {
            background-color: #e8f1ed;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #165b35;
            font-size: 30px;
        }

        canvas {
            border: 5px solid #165b35;
            max-width: 95%;
            height: auto;
            background: #ffffff;
            border-radius: 10px;
        }
    </style>
</head>

<body>



<canvas id="myCanvas" width="700" height="500"></canvas>

<script>
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

// Function for drawing stars
function drawStar(x, y, size, color) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
        let angle = -Math.PI / 2 + i * Math.PI / 5;
        let radius = i % 2 === 0 ? size : size / 2;
        let px = x + Math.cos(angle) * radius;
        let py = y + Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
}

// Function for drawing snowflakes
function drawSnowflake(x, y) {
    ctx.beginPath();
    ctx.moveTo(x - 10, y);
    ctx.lineTo(x + 10, y);
    ctx.moveTo(x, y - 10);
    ctx.lineTo(x, y + 10);
    ctx.strokeStyle = "#87ceeb";
    ctx.lineWidth = 2;
    ctx.stroke();
}

// Function for drawing baubles
function drawBall(x, y, color) {
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
}

// Card border
ctx.strokeStyle = "#165b35";
ctx.lineWidth = 4;
ctx.strokeRect(20, 20, 660, 460);

// Title
ctx.fillStyle = "#165b35";
ctx.font = "bold 30px Arial";
ctx.textAlign = "center";
ctx.fillText("MERRY CHRISTMAS!", 350, 70);

// Small message
ctx.fillStyle = "#b22222";
ctx.font = "18px Arial";

// Stars
drawStar(100, 80, 15, "#ffcc00");
drawStar(600, 80, 15, "#ffcc00");

// Snowflakes
drawSnowflake(120, 150);
drawSnowflake(580, 150);
drawSnowflake(180, 420);
drawSnowflake(520, 420);

// Christmas tree - top
ctx.beginPath();
ctx.moveTo(350, 130);
ctx.lineTo(290, 220);
ctx.lineTo(410, 220);
ctx.closePath();
ctx.fillStyle = "#2e8b57";
ctx.fill();

// Christmas tree - middle
ctx.beginPath();
ctx.moveTo(350, 190);
ctx.lineTo(260, 300);
ctx.lineTo(440, 300);
ctx.closePath();
ctx.fillStyle = "#228b22";
ctx.fill();

// Christmas tree - bottom
ctx.beginPath();
ctx.moveTo(350, 260);
ctx.lineTo(220, 390);
ctx.lineTo(480, 390);
ctx.closePath();
ctx.fillStyle = "#006400";
ctx.fill();

// Tree trunk
ctx.fillStyle = "#8b4513";
ctx.fillRect(325, 390, 50, 60);

// Star on top of tree
drawStar(350, 115, 12, "#ffcc00");

// Decorations on tree
drawBall(330, 200, "#ff0000");
drawBall(370, 240, "#ffcc00");
drawBall(300, 280, "#ff0000");
drawBall(400, 320, "#ffcc00");
drawBall(350, 350, "#ff0000");

// Gift box
ctx.fillStyle = "#e63946";
ctx.fillRect(130, 410, 80, 70);
ctx.fillStyle = "#ffcc00";
ctx.fillRect(165, 410, 10, 70);
ctx.fillRect(130, 440, 80, 10);

// Another gift box
ctx.fillStyle = "#3498db";
ctx.fillRect(490, 420, 60, 60);
ctx.fillStyle = "#ffcc00";
ctx.fillRect(515, 420, 10, 60);
ctx.fillRect(490, 445, 60, 10);

// Bottom greeting
ctx.fillStyle = "#165b35";
ctx.font = "20px Arial";


</script>

</body>
</html>
