<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grades</title>
    <style>
        table,
        th,
        td {
            border: 1px solid green;
            border-collapse: collapse;
            padding: 5px;
        }

        #message {
            color: darkgreen;
            margin-top: auto;
        }
    </style>
</head>

<body>
    <center>
        <div class="form-container">
            <label for="txtLRN">LRN </label>
            <input type="text" id="txtLRN">

            <label for="txtSection">Section</label>
            <input type="text" id="txtSection">

            <label for="txtName">Name </label>
            <input type="text" id="txtName">

            <label for="txtSubject">Subject </label>
            <input type="text" id="txtSubject">

            <label for="txtGrade">Grade </label>
            <input type="text" id="txtGrade" style="width: 60px;">
            <button id="btnSave">Save</button>
        </div>

        <div id="message"></div>
        <table border="1">
            <tr>
                <th>LRN</th>
                <th>Section</th>
                <th>Name</th>
                <th>Subject</th>
                <th>Grade</th>
                <th>Action</th>
            </tr>
            <tbody id="tableBody"></tbody>
        </table>
    </center>
    <script>
        var txtLRN = document.getElementById("txtLRN");
        var txtSection = document.getElementById("txtSection");
        var txtName = document.getElementById("txtName");
        var txtSubject = document.getElementById("txtSubject");
        var txtGrade = document.getElementById("txtGrade");
        var btnSave = document.getElementById("btnSave");
        var tableBody = document.getElementById("tableBody");
        var message = document.getElementById("message");
        var grades = JSON.parse(localStorage.getItem("grades")) || [];
        var selectedIndex = -1;
        function showGrades() {
            tableBody.textContent = "";
            for (var i = 0; i < grades.length; i++) {
                var row = tableBody.insertRow();
                row.insertCell().textContent = grades[i].lrn;
                row.insertCell().textContent = grades[i].section;
                row.insertCell().textContent = grades[i].name;
                row.insertCell().textContent = grades[i].subject;
                row.insertCell().textContent = grades[i].grade;
                var actionCell = row.insertCell();
                actionCell.appendChild(makeUpdateButton(i));
                actionCell.appendChild(makeDeleteButton(i));

                function makeUpdateButton(index) {
                    var button = document.createElement("button");
                    button.textContent = "update";
                    button.addEventListener("click", function () {
                        loadForUpdate(index);
                    })
                    return button;
                }
                function makeDeleteButton(index) {
                    var button = document.createElement("button");
                    button.textContent = "Delete";
                    button.addEventListener("click", function () {
                        deleteGrade(index);
                    });
                    return button;
                }
                function loadForUpdate(index) {
                    selectedIndex = index;

                    txtLRN.value = grades[index].lrn;
                    txtSection.value = grades[index].section;
                    txtName.value = grades[index].name;
                    txtSubject.value = grades[index].subject;
                    txtGrade.value = grades[index].grade;
                    btnSave.value = "Update";
                    message.textContent = "Change the values, then click the update button above the table.";

                }
            }
        }

        function deleteGrade(index){
            var sure = confirm("Delete record of " + grades[index].name + "?");
            if (!sure){
                return;
            }
            grades.splice(index, 1);
            if (selectedIndex === index){
                selectedIndex = -1;
                btnSave.value = "Save";
                txtLRN.value = "";
                txtSection.value = "";
                txtName.value = "";
                txtSubject.value = "";
                txtGrade.value = "";
            }else if(selectedIndex > index){
                selectedIndex = selectedIndex -1;
            }
            localStorage.setItem("grades",JSON.stringify(grades));
            message.textContent = "Deleted";
            showGrades();
        }
        function saveGrade() {
            var lrn = txtLRN.value.trim();
            var section = txtSection.value.trim();
            var name = txtName.value.trim();
            var subject = txtSubject.value.trim();
            var grade = txtGrade.value.trim()
            if (lrn === "" || section === "" || name === "" || subject === "" || grade === "") {
                message.textContent = "Please bro fill in all the boxes.";
                return;
            }
            var record = { lrn: lrn, section: section, name: name, subject: subject, grade: grade };
            if (selectedIndex === -1) {
                grades.push(record);
                message.textContent = "Saved";

            } else {
                grades[selectedIndex] = record;
                message.textContent = "Updated";
                selectedIndex = -1;
                btnSave.value = "save";
            }
            localStorage.setItem("grades", JSON.stringify(grades));
            message.textContent = "saved";
            txtLRN.value = "";
            txtSection.value = "";
            txtName.value = "";
            txtSubject.value = "";
            txtGrade.value = "";
            showGrades();
        }
        btnSave.addEventListener("click", saveGrade);
        showGrades();

    

    </script>
</body>

</html>
