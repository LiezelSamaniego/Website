<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<title>Flexbox Practice</title> 
<style> 
.container { 
display: flex; 
width: 560px; 
height: 140px; 
align-items: flex-start; 
} 
.box { width: 80px; height: 50px; } 
.box:nth-child(1) { order: 3; }               /* shown last */ 
.box:nth-child(2) { align-self: flex-end; }   /* drops to the bottom */
//.container { display: flex; width: 600px; } 
.box { width: 100px; height: 50px; flex-grow: 1; } 
.box:nth-child(2) { flex-grow: 2; }
.container { display: flex; width: 600px; height: 90px; color: #fff; } 
.sidebar { flex: 0 0 150px; background: #1F3864; }  /* fixed width */ 
.main    { flex: 1;         background: #4472C4; }  /* takes the rest */
//.container { 
display: flex; 
flex-wrap: wrap;   /* nowrap is the default */ 
gap: 10px; 
width: 400px; 
} 
.box { width: 100px; height: 50px; }
//.container { 
display: flex; 
justify-content: center;  /* centers on the main axis (horizontal) */ 
align-items: center;      /* centers on the cross axis (vertical) */ 
width: 400px; 
height: 160px; 
} 
.box { width: 120px; height: 60px; }
//.container { 
display: flex; 
width: 270px; 
height: 140px; 
align-items: center;  /* stretch | flex-start | center | flex-end */ 
} 
.box { width: 60px; height: 50px; } 
//.container { 
display: flex; 
width: 560px; 
justify-content: space-between; 
} 
.box { width: 80px; height: 45px; }
//.container { 
display: flex; 
flex-direction: row-reverse;  /* row | column | column-reverse */ 
} 
.box { width: 60px; height: 40px; }
//.container { display: flex; } 
.box { 
display: flex; 
align-items: center; 
justify-content: center; 
width: 100px; 
height: 50px; 
background: #4472C4; 
color: #fff; 
font-weight: bold; 
} 
</style> 
</head> 
<body> 
<div class="container"> 
<div class="box">1</div> 
<div class="box">2</div> 
<div class="box">3</div> 
</div> 
</body> 
</html>
