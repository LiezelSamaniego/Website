</head>

<body>

    <h1>JavaScript</h1>

    <script>

        console.log("hello JavaScript");

        var first = 10;
        var second = 10;

        var sum = first + second;
        var sub = first - second;
        var mul = first * second;
        var mod = first % second;

        console.log(first + " + " + second + " = " + sum);
        console.log(first + " - " + second + " = " + sub);
        console.log(first + " * " + second + " = " + mul);
        console.log(first + " % " + second + " = " + mod);

    </script>
